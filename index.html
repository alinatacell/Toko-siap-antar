<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Produk Member - Toko Siap Antar</title>


<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Segoe UI,sans-serif;background:#f4f6f8;color:#222}
header{background:#111;color:#fff;padding:16px;position:sticky;top:0;z-index:20}
.header-inner{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:center;position:relative;text-align:center}
header h1{margin:0;font-size:20px} header p{margin:5px 0 0;font-size:12px;opacity:.8}
.cart-top{position:absolute;right:0;top:50%;transform:translateY(-50%);border:0;background:#16a34a;color:#fff;border-radius:22px;padding:9px 13px;font-size:15px;font-weight:bold}
.container{max-width:1100px;margin:auto;padding:14px}
.search{width:100%;padding:12px 15px;border:1px solid #ddd;border-radius:10px;outline:none;font-size:15px;margin-bottom:12px}
.info{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:#555;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.table-wrap{background:#fff;border-radius:12px;overflow:auto;box-shadow:0 2px 10px rgba(0,0,0,.07)}
table{width:100%;border-collapse:collapse;min-width:760px}
th{background:#16a34a;color:#fff;padding:11px 10px;text-align:left;font-size:13px;position:sticky;top:0;z-index:2}
td{padding:10px;border-bottom:1px solid #eee;font-size:13px;vertical-align:middle}
tr:hover{background:#f8faf9}
.no-data{text-align:center;padding:25px;color:#777}
.loading{text-align:center;padding:25px;color:#555}
.error{background:#fff1f2;color:#b91c1c;padding:14px;border-radius:10px;line-height:1.5}
.harga{font-weight:bold;color:#ea580c;white-space:nowrap}
.add-cart{border:0;background:#16a34a;color:#fff;border-radius:8px;padding:8px 10px;font-weight:bold;white-space:nowrap}
.cart-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
.cart-panel{position:fixed;right:-420px;top:0;width:min(420px,92vw);height:100vh;background:#fff;z-index:50;box-shadow:-4px 0 18px rgba(0,0,0,.2);transition:right .25s;display:flex;flex-direction:column}
.cart-panel.open{right:0}
.cart-head{padding:16px;background:#111;color:#fff;display:flex;justify-content:space-between;align-items:center}
.cart-head button{border:0;background:transparent;color:#fff;font-size:20px}
#cartItems{padding:12px;overflow:auto;flex:1}
.cart-row{border-bottom:1px solid #eee;padding:10px 0}
.cart-row-top{display:flex;justify-content:space-between;gap:10px}
.qty{display:flex;align-items:center;gap:7px;margin-top:8px}
.qty button{width:30px;height:30px;border:1px solid #ddd;background:#f5f5f5;border-radius:6px;font-size:18px}
.cart-foot{padding:14px;border-top:1px solid #ddd;background:#fff}
.checkout{width:100%;margin-top:10px;padding:12px;border:0;border-radius:9px;background:#16a34a;color:#fff;font-weight:bold}
@media(max-width:600px){header h1{font-size:19px}.cart-top{right:4px}}
</style>

</head>



<body>
<header>
  <div class="header-inner">
    <div>
      <h1>🛒 TOKO SIAP ANTAR</h1>
      <p>Daftar Produk Member</p>
    </div>
    <button id="cartButton" class="cart-top" onclick="bukaKeranjang()">🛒 <span id="cartCount">0</span></button>
  </div>
</header>

<div class="container">
  <input id="searchInput" class="search" type="search"
         placeholder="🔎 Cari nama atau deskripsi produk...">

  <div class="info">
    Menampilkan data langsung dari <b>Google Spreadsheet MEMBER</b>.<br>
    Tanpa gambar — hanya <b>Nama Produk, Deskripsi, Harga</b> dan tombol keranjang.
    <span id="jumlah">Memuat...</span>
  </div>

  <div id="status" class="loading">Memuat data Spreadsheet...</div>

  <div class="table-wrap" id="tableWrap" style="display:none">
    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>Nama Produk</th>
          <th>Deskripsi</th>
          <th>Keranjang</th>
        </tr>
      </thead>
      <tbody id="produkList"></tbody>
    </table>
  </div>
</div>

<div id="cartOverlay" class="cart-overlay" onclick="tutupKeranjang()"></div>
<div id="cartPanel" class="cart-panel">
  <div class="cart-head">
    <b>🛒 Keranjang</b>
    <button onclick="tutupKeranjang()">✕</button>
  </div>
  <div id="cartItems"></div>
  <div class="cart-foot">
    <b>Total: <span id="cartTotal">Rp 0</span></b>
    <button class="checkout" onclick="checkoutKeranjang()">Lanjut Pesanan</button>
  </div>
</div>

<script>
const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vTAP_R50frV13whqx54ctjplc-8xhcN53rHEVk5mkhLeZE283xWnr6TdTBFr-KFymEiaYE_NWgGthpo/pub?gid=694779852&single=true&output=csv";

let semuaProduk=[];
let keranjang=JSON.parse(localStorage.getItem("produkMemberCart")||"[]");

function aman(t){return String(t??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function rupiah(v){let n=Number(String(v).replace(/[^\d.-]/g,""));return Number.isFinite(n)?"Rp "+n.toLocaleString("id-ID"):v||""}

function parseCSV(text){
  const rows=[];let row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(c=='"'&&quoted&&n=='"'){cell+='"';i++;continue}
    if(c=='"'){quoted=!quoted;continue}
    if(c==','&&!quoted){row.push(cell);cell="";continue}
    if((c=='\n'||c=='\r')&&!quoted){
      if(c=='\r'&&n=='\n')i++;
      row.push(cell);cell="";
      if(row.some(v=>String(v).trim()))rows.push(row);
      row=[];continue
    }
    cell+=c
  }
  if(cell!==""||row.length){row.push(cell);if(row.some(v=>String(v).trim()))rows.push(row)}
  return rows
}

function tampilkanProduk(data){
  const list=document.getElementById("produkList");
  document.getElementById("jumlah").textContent=" • "+data.length+" produk";

  if(!data.length){
    list.innerHTML='<tr><td colspan="4" class="no-data">Produk tidak ditemukan.</td></tr>';
    return;
  }

  list.innerHTML=data.map((p,i)=>`
    <tr>
      <td>${i+1}</td>
      <td><b>${aman(p.nama)}</b></td>
      <td>${aman(p.deskripsi)}</td>
      <td>
        <button class="add-cart" onclick="tambahKeranjang('${p.id}')">
          🛒 Keranjang
        </button>
      </td>
    </tr>`).join("")
}
function tambahKeranjang(id){
  const p=semuaProduk.find(x=>x.id===id);if(!p)return;
  const x=keranjang.find(x=>x.id===id);
  if(x)x.qty++;else keranjang.push({id:p.id,nama:p.nama,harga:p.harga,qty:1});
  simpanCart();updateCartCount();bukaKeranjang()
}
function ubahQty(id,d){
  const x=keranjang.find(x=>x.id===id);if(!x)return;
  x.qty+=d;if(x.qty<=0)keranjang=keranjang.filter(y=>y.id!==id);
  simpanCart();renderCart();updateCartCount()
}
function simpanCart(){localStorage.setItem("produkMemberCart",JSON.stringify(keranjang))}
function updateCartCount(){document.getElementById("cartCount").textContent=keranjang.reduce((a,x)=>a+(+x.qty||0),0)}
function renderCart(){
  const box=document.getElementById("cartItems");
  if(!keranjang.length){box.innerHTML='<div class="no-data">Keranjang masih kosong.</div>';document.getElementById("cartTotal").textContent="Rp 0";return}
  let total=0;
  box.innerHTML=keranjang.map(x=>{
    const h=Number(String(x.harga).replace(/[^\d.-]/g,""))||0;total+=h*x.qty;
    return `<div class="cart-row"><div class="cart-row-top"><b>${aman(x.nama)}</b><span>${rupiah(h*x.qty)}</span></div><div class="qty"><button onclick="ubahQty('${x.id}',-1)">−</button><b>${x.qty}</b><button onclick="ubahQty('${x.id}',1)">+</button></div></div>`
  }).join("");
  document.getElementById("cartTotal").textContent=rupiah(total)
}
function bukaKeranjang(){renderCart();document.getElementById("cartPanel").classList.add("open");document.getElementById("cartOverlay").style.display="block"}
function tutupKeranjang(){document.getElementById("cartPanel").classList.remove("open");document.getElementById("cartOverlay").style.display="none"}
function checkoutKeranjang(){
  if(!keranjang.length){alert("Keranjang masih kosong.");return}
  const p=["Halo Kak, saya mau pesan:","",...keranjang.map((x,i)=>`${i+1}. ${x.nama} x${x.qty}`),"","Mohon dicek ketersediaannya."].join("\n");
  window.open("https://wa.me/?text="+encodeURIComponent(p),"_blank")
}

document.getElementById("searchInput").addEventListener("input",function(){
  const q=this.value.toLowerCase().trim();
  tampilkanProduk(q?semuaProduk.filter(p=>p.nama.toLowerCase().includes(q)||p.deskripsi.toLowerCase().includes(q)):semuaProduk)
});

fetch(sheetURL).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.text()})
.then(text=>{
  const rows=parseCSV(text);
  semuaProduk=rows.slice(1).map((r,i)=>({id:String(i+2),nama:r[1]||"",deskripsi:r[2]||"",harga:r[3]||""})).filter(p=>p.nama.trim());
  document.getElementById("status").style.display="none";
  document.getElementById("tableWrap").style.display="block";
  tampilkanProduk(semuaProduk);updateCartCount()
})
.catch(e=>{
  document.getElementById("status").className="error";
  document.getElementById("status").innerHTML="❌ Data tidak dapat dimuat saat file dibuka langsung dari HP.<br><small>"+aman(e.message)+"</small><br><br>Halaman perlu di-host (misalnya GitHub Pages) agar data dapat dibaca dan tombol keranjang per baris dapat bekerja."
});
updateCartCount();
</script>

</body>


</html>
